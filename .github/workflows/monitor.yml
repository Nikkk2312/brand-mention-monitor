name: Brand mention monitor

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (GitHub skips :00 runs when busy)
  workflow_dispatch:

permissions:
  contents: write         # to commit state/seen.json back

concurrency:
  group: monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Check the sources, retry once on a network failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m monitor run || (echo "First try failed, waiting 60 seconds" && sleep 60 && python -m monitor run)

      - name: Commit the seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to commit"
          else
            git commit -m "Update seen state"
            git push
          fi
